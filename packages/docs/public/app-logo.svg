<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">QScroller logo</title>
  <desc id="desc">Three scrolling picker columns with a highlighted selected row.</desc>
  <defs>
    <linearGradient id="bg" x1="16" x2="112" y1="12" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10243c" />
      <stop offset="1" stop-color="#07101f" />
    </linearGradient>
    <linearGradient id="accent" x1="26" x2="102" y1="35" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#43f0c6" />
      <stop offset="1" stop-color="#2e8bff" />
    </linearGradient>
    <linearGradient id="column" x1="32" x2="96" y1="22" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24" />
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".32" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)" />
  <g filter="url(#shadow)">
    <rect x="24" y="20" width="80" height="88" rx="18" fill="#0d1a2d" stroke="#8ae9ff" stroke-opacity=".35" stroke-width="2" />
    <rect x="31" y="28" width="18" height="72" rx="9" fill="url(#column)" />
    <rect x="55" y="28" width="18" height="72" rx="9" fill="url(#column)" />
    <rect x="79" y="28" width="18" height="72" rx="9" fill="url(#column)" />
    <rect x="28" y="51" width="72" height="26" rx="13" fill="url(#accent)" opacity=".95" />
    <g fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <text x="40" y="47" opacity=".48">08</text>
      <text x="64" y="47" opacity=".48">24</text>
      <text x="88" y="47" opacity=".48">AM</text>
      <text x="40" y="68">09</text>
      <text x="64" y="68">30</text>
      <text x="88" y="68">PM</text>
      <text x="40" y="91" opacity=".48">10</text>
      <text x="64" y="91" opacity=".48">45</text>
      <text x="88" y="91" opacity=".48">--</text>
    </g>
    <path d="M29 50h70M29 78h70" stroke="#fff" stroke-opacity=".55" stroke-width="2" />
  </g>
</svg>
